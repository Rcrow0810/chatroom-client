# Builds the Windows app and attaches it to a GitHub Release.
# Run it by pushing a tag like v1.0 (git tag v1.0 && git push origin v1.0),
# or from the repo's Actions tab -> "Build Windows app" -> Run workflow.
name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add chat.key and server.crt (from repo secrets, never stored in the repo)
        shell: pwsh
        env:
          CHAT_KEY_B64: ${{ secrets.CHAT_KEY_B64 }}
          SERVER_CRT_B64: ${{ secrets.SERVER_CRT_B64 }}
        run: |
          if (-not $env:CHAT_KEY_B64 -or -not $env:SERVER_CRT_B64) { throw "Add the CHAT_KEY_B64 and SERVER_CRT_B64 repository secrets first." }
          [IO.File]::WriteAllBytes("chat.key", [Convert]::FromBase64String($env:CHAT_KEY_B64))
          [IO.File]::WriteAllBytes("server.crt", [Convert]::FromBase64String($env:SERVER_CRT_B64))

      - name: Build
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --clean --windowed --name ChatClient --collect-submodules qrcode --collect-submodules plyer --add-data "chat.key;." --add-data "server.crt;." --add-data "icon.png;." --add-data "icon.ico;." --icon icon.ico login_app.py

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\ChatClient -DestinationPath ChatClient-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag ChatClient-windows.zip --title "Chat Client $tag" --notes "Windows download: unzip, then run ChatClient.exe and type the server's IP." }
          else { gh release upload $tag ChatClient-windows.zip --clobber }

      - name: Keep the zip (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: ChatClient-windows
          path: ChatClient-windows.zip
